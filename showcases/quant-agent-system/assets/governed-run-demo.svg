<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">BTC Quant Agent System synthetic governed run</title>
  <desc id="desc">A synthetic request moves through routing, dry-run lifecycle, evidence classification, and release decision. The live request is refused and execution authority remains false.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101827"/>
      <stop offset="1" stop-color="#172337"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#59d6b4"/>
      <stop offset="1" stop-color="#64a5ff"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .label { font: 500 22px ui-sans-serif, system-ui, sans-serif; fill: #e8eef8; }
      .small { font: 400 17px ui-sans-serif, system-ui, sans-serif; fill: #9fb0c8; }
      .mono { font: 500 18px ui-monospace, SFMono-Regular, Consolas, monospace; fill: #d7e3f5; }
      .muted { fill: #71849f; }
      .node { fill: #1b2a40; stroke: #32465f; stroke-width: 2; }
      .active { fill: #183b42; stroke: #59d6b4; stroke-width: 2; }
      .blocked { fill: #3b2930; stroke: #f28c8c; stroke-width: 2; }
      .chip { fill: #20324a; }
    </style>
  </defs>

  <rect width="1200" height="620" rx="28" fill="url(#bg)"/>
  <text x="58" y="62" class="label" font-size="28">BTC QUANT AGENT SYSTEM</text>
  <text x="58" y="92" class="small">Synthetic public run · research_only · no exchange connection</text>
  <rect x="968" y="40" width="174" height="40" rx="20" class="chip"/>
  <text x="1055" y="66" text-anchor="middle" class="mono" fill="#59d6b4">PUBLIC DEMO</text>

  <text x="58" y="145" class="small">REQUEST</text>
  <rect x="58" y="166" width="214" height="102" rx="16" class="node"/>
  <text x="82" y="202" class="label">dry_run_lifecycle</text>
  <text x="82" y="231" class="small">synthetic task</text>
  <text x="82" y="255" class="mono">DEMO-DRYRUN-001</text>

  <path d="M272 217 H322" stroke="#3c536e" stroke-width="3"/>
  <circle cx="272" cy="217" r="6" fill="#59d6b4">
    <animate attributeName="cx" values="272;322;272" dur="3.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.15;1" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <text x="338" y="145" class="small">ROUTE</text>
  <rect x="322" y="166" width="214" height="102" rx="16" class="active"/>
  <text x="346" y="202" class="label">allow</text>
  <text x="346" y="231" class="small">plane: execution</text>
  <text x="346" y="255" class="mono">bounded dry-run</text>

  <path d="M536 217 H586" stroke="#3c536e" stroke-width="3"/>
  <circle cx="536" cy="217" r="6" fill="#59d6b4">
    <animate attributeName="cx" values="536;586;536" dur="3.2s" begin=".8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.15;1" dur="3.2s" begin=".8s" repeatCount="indefinite"/>
  </circle>

  <text x="602" y="145" class="small">LIFECYCLE</text>
  <rect x="586" y="166" width="214" height="102" rx="16" class="active"/>
  <text x="610" y="202" class="label">reconciled</text>
  <text x="610" y="231" class="small">intent → events</text>
  <text x="610" y="255" class="mono">orders: 0 · fills: 0</text>

  <path d="M800 217 H850" stroke="#3c536e" stroke-width="3"/>
  <circle cx="800" cy="217" r="6" fill="#59d6b4">
    <animate attributeName="cx" values="800;850;800" dur="3.2s" begin="1.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.15;1" dur="3.2s" begin="1.6s" repeatCount="indefinite"/>
  </circle>

  <text x="866" y="145" class="small">EVIDENCE</text>
  <rect x="850" y="166" width="292" height="102" rx="16" class="active"/>
  <text x="874" y="202" class="label">dry_run evidence</text>
  <text x="874" y="231" class="small">claims stay bounded</text>
  <text x="874" y="255" class="mono">release: research_only</text>

  <line x1="58" y1="330" x2="1142" y2="330" stroke="#2b3d55" stroke-width="2"/>
  <text x="58" y="372" class="small">VISIBLE DECISIONS</text>
  <rect x="58" y="396" width="328" height="122" rx="16" class="node"/>
  <text x="84" y="434" class="label">execution_authority</text>
  <text x="84" y="481" class="mono" fill="#f28c8c">false</text>
  <text x="84" y="505" class="small">public package cannot create it</text>

  <rect x="416" y="396" width="328" height="122" rx="16" class="node"/>
  <text x="442" y="434" class="label">next_allowed_action</text>
  <text x="442" y="481" class="mono" fill="#59d6b4">human_review</text>
  <text x="442" y="505" class="small">research continues under review</text>

  <rect x="774" y="396" width="368" height="122" rx="16" class="blocked"/>
  <text x="800" y="434" class="label">live_request</text>
  <text x="800" y="481" class="mono" fill="#f28c8c">refuse · lifecycle not started</text>
  <text x="800" y="505" class="small">same gate applies every run</text>

  <circle cx="600" cy="567" r="7" fill="#59d6b4" filter="url(#glow)">
    <animate attributeName="r" values="6;11;6" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;.35;1" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <text x="620" y="574" class="small">synthetic inputs · machine-readable decision record · real orders 0</text>
</svg>
