<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="620" fill="url(#bg)" rx="16" />

  <!-- Outer Border -->
  <rect x="2" y="2" width="996" height="616" fill="none" stroke="#334155" stroke-width="2" rx="15" />

  <!-- Header -->
  <text x="50" y="55" font-family="'Segoe UI', Inter, sans-serif" font-size="24" font-weight="bold" fill="#f8fafc">
    Trade Desk Copilot · System Architecture
  </text>
  <text x="50" y="82" font-family="'Segoe UI', Inter, sans-serif" font-size="14" fill="#94a3b8">
    Multi-Turn B2B Negotiation Assistant with Window-Level State Tracking &amp; Multimodal Card Synthesis
  </text>
  <rect x="790" y="38" width="160" height="32" rx="6" fill="#0d9488" />
  <text x="870" y="59" font-family="'Segoe UI', Inter, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">
    LuminaTech Engine
  </text>

  <!-- Layer 1: Host App Ingestion -->
  <g filter="url(#shadow)">
    <rect x="50" y="115" width="900" height="75" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <rect x="50" y="115" width="8" height="75" fill="#38bdf8" rx="4" />
    <text x="75" y="145" font-family="'Segoe UI', Inter, sans-serif" font-size="13" font-weight="bold" fill="#38bdf8">
      1. INGESTION &amp; HOST PERCEPTION LAYER
    </text>
    <text x="75" y="168" font-family="'Segoe UI', Inter, sans-serif" font-size="12" fill="#cbd5e1">
      Foreground Window Monitor · Safe Win32 Clipboard Transaction · Global Hotkey (Alt+R) · Buyer Inquiry Capture
    </text>

    <!-- Host Badges -->
    <rect x="680" y="132" width="75" height="26" rx="4" fill="#0f172a" stroke="#475569" />
    <text x="717" y="149" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">WhatsApp</text>

    <rect x="765" y="132" width="80" height="26" rx="4" fill="#0f172a" stroke="#475569" />
    <text x="805" y="149" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">TradeManager</text>

    <rect x="855" y="132" width="75" height="26" rx="4" fill="#0f172a" stroke="#475569" />
    <text x="892" y="149" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Mail Client</text>
  </g>

  <!-- Layer 2: Core Processing Split (DST + RAG) -->
  <g filter="url(#shadow)">
    <!-- Left Box: Dialogue State Tracker -->
    <rect x="50" y="210" width="435" height="155" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <rect x="50" y="210" width="8" height="155" fill="#2dd4bf" rx="4" />
    <text x="75" y="240" font-family="'Segoe UI', Inter, sans-serif" font-size="13" font-weight="bold" fill="#2dd4bf">
      2A. MULTI-TURN DIALOGUE STATE TRACKER (DST)
    </text>
    <text x="75" y="265" font-family="'Segoe UI', Inter, sans-serif" font-size="12" fill="#94a3b8">
      Window-Level Session Isolation (Session ID Hash)
    </text>
    <rect x="75" y="280" width="105" height="24" rx="12" fill="#0f172a" stroke="#0d9488" />
    <text x="127" y="296" font-family="'Segoe UI', sans-serif" font-size="10" fill="#2dd4bf" text-anchor="middle">Category Slot</text>
    <rect x="190" y="280" width="105" height="24" rx="12" fill="#0f172a" stroke="#0d9488" />
    <text x="242" y="296" font-family="'Segoe UI', sans-serif" font-size="10" fill="#2dd4bf" text-anchor="middle">Bulk / Sample Qty</text>
    <rect x="305" y="280" width="105" height="24" rx="12" fill="#0f172a" stroke="#0d9488" />
    <text x="357" y="296" font-family="'Segoe UI', sans-serif" font-size="10" fill="#2dd4bf" text-anchor="middle">Dimming / Voltage</text>

    <text x="75" y="335" font-family="'Segoe UI', Inter, sans-serif" font-size="11" fill="#cbd5e1">
      • Interactive GUI chips with one-click slot removal (✕)
    </text>
    <text x="75" y="352" font-family="'Segoe UI', Inter, sans-serif" font-size="11" fill="#cbd5e1">
      • Prevents cross-buyer memory contamination across multi-tabs
    </text>

    <!-- Right Box: Hybrid BM25 Knowledge Retrieval -->
    <rect x="515" y="210" width="435" height="155" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <rect x="515" y="210" width="8" height="155" fill="#f59e0b" rx="4" />
    <text x="540" y="240" font-family="'Segoe UI', Inter, sans-serif" font-size="13" font-weight="bold" fill="#f59e0b">
      2B. HYBRID RAG RETRIEVAL ENGINE
    </text>
    <text x="540" y="265" font-family="'Segoe UI', Inter, sans-serif" font-size="12" fill="#94a3b8">
      Corpus Chunking + BM25 Scoring with CJK/EN Stopwords
    </text>

    <rect x="540" y="280" width="120" height="24" rx="4" fill="#0f172a" stroke="#475569" />
    <text x="600" y="296" font-family="'Segoe UI', sans-serif" font-size="10" fill="#f8fafc" text-anchor="middle">Downlights (LT-DL)</text>

    <rect x="670" y="280" width="120" height="24" rx="4" fill="#0f172a" stroke="#475569" />
    <text x="730" y="296" font-family="'Segoe UI', sans-serif" font-size="10" fill="#f8fafc" text-anchor="middle">Fan Lights (LT-SF)</text>

    <rect x="800" y="280" width="120" height="24" rx="4" fill="#0f172a" stroke="#475569" />
    <text x="860" y="296" font-family="'Segoe UI', sans-serif" font-size="10" fill="#f8fafc" text-anchor="middle">LED Drivers (LT-DRV)</text>

    <text x="540" y="335" font-family="'Segoe UI', Inter, sans-serif" font-size="11" fill="#cbd5e1">
      • SKU, MOQ, CBM Carton Specs &amp; Tiered FOB Pricing
    </text>
    <text x="540" y="352" font-family="'Segoe UI', Inter, sans-serif" font-size="11" fill="#cbd5e1">
      • Factory Credentials, SGS/TÜV Audits &amp; 5-Year Warranty Terms
    </text>
  </g>

  <!-- Layer 3: Response Synthesis & Style Routing -->
  <g filter="url(#shadow)">
    <rect x="50" y="385" width="900" height="95" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <rect x="50" y="385" width="8" height="95" fill="#a855f7" rx="4" />
    <text x="75" y="415" font-family="'Segoe UI', Inter, sans-serif" font-size="13" font-weight="bold" fill="#a855f7">
      3. MULTI-STYLE RESPONSE SYNTHESIS &amp; INLINE REFINEMENT
    </text>

    <!-- 3 Style Badges -->
    <rect x="75" y="430" width="165" height="34" rx="6" fill="#0f172a" stroke="#334155" />
    <text x="157" y="451" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#38bdf8" text-anchor="middle">🌟 B2B Deal Closing</text>

    <rect x="250" y="430" width="165" height="34" rx="6" fill="#0f172a" stroke="#334155" />
    <text x="332" y="451" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#2dd4bf" text-anchor="middle">⚡ WhatsApp Quick</text>

    <rect x="425" y="430" width="165" height="34" rx="6" fill="#0f172a" stroke="#334155" />
    <text x="507" y="451" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#f59e0b" text-anchor="middle">📐 Engineering Spec</text>

    <text x="615" y="445" font-family="'Segoe UI', Inter, sans-serif" font-size="11" fill="#94a3b8">
      Inline Natural Language Prompt Refinement:
    </text>
    <text x="615" y="462" font-family="'Segoe UI', Inter, sans-serif" font-size="11" fill="#cbd5e1">
      "精简50%" · "插入CBM海运参数" · "特批3%试单折扣"
    </text>
  </g>

  <!-- Layer 4: Multimodal Output Deliverables -->
  <g filter="url(#shadow)">
    <rect x="50" y="500" width="900" height="90" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <rect x="50" y="500" width="8" height="90" fill="#ec4899" rx="4" />
    <text x="75" y="528" font-family="'Segoe UI', Inter, sans-serif" font-size="13" font-weight="bold" fill="#ec4899">
      4. MULTIMODAL OUTPUT &amp; HOST-AWARE DELIVERABLES
    </text>

    <text x="75" y="555" font-family="'Segoe UI', Inter, sans-serif" font-size="12" fill="#cbd5e1">
      • <tspan fill="#38bdf8" font-weight="bold">Host-Aware Text Formatting</tspan>: Auto-strips markdown asterisks for IMs, converts to WhatsApp *bold*, outputs CF_HTML for emails
    </text>
    <text x="75" y="575" font-family="'Segoe UI', Inter, sans-serif" font-size="12" fill="#cbd5e1">
      • <tspan fill="#2dd4bf" font-weight="bold">1080×1080 Quotation Card</tspan>: High-resolution visual spec sheet with Pillow layout, anti-overflow typography &amp; zero-dependency QR code
    </text>
  </g>
</svg>
