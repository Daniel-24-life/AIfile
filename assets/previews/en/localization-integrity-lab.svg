<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="indigoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="600" fill="url(#bgGrad)" rx="16" />
  <rect x="2" y="2" width="996" height="596" fill="none" stroke="#1f2937" stroke-width="2" rx="15" />

  <!-- Header -->
  <text x="50" y="52" font-family="'Segoe UI', Inter, sans-serif" font-size="24" font-weight="bold" fill="#f9fafb">
    Localization Integrity Lab · Research Architecture
  </text>
  <text x="50" y="78" font-family="'Segoe UI', Inter, sans-serif" font-size="13" fill="#9ca3af">
    From Kinematic ODEs and Absorbing Boundary PDEs to Provable Positioning Integrity
  </text>
  <rect x="780" y="35" width="170" height="32" rx="6" fill="#4f46e5" />
  <text x="865" y="56" font-family="'Segoe UI', Inter, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">
    Mathematical Core
  </text>

  <!-- Stage 1: Kinematic ODE -->
  <g filter="url(#cardShadow)">
    <rect x="50" y="110" width="280" height="210" rx="10" fill="#1f2937" stroke="#374151" stroke-width="1.5" />
    <rect x="50" y="110" width="6" height="210" fill="#38bdf8" rx="3" />
    <text x="70" y="140" font-family="'Segoe UI', Inter, sans-serif" font-size="14" font-weight="bold" fill="#38bdf8">
      1. KINEMATIC ODE &amp; SLIP
    </text>
    <text x="70" y="165" font-family="'Segoe UI', sans-serif" font-size="11" fill="#9ca3af">
      Differential Drive Planar Model
    </text>

    <!-- Formula Box -->
    <rect x="70" y="180" width="240" height="65" rx="6" fill="#111827" stroke="#374151" />
    <text x="80" y="202" font-family="'Courier New', monospace" font-size="11" fill="#e5e7eb">dx/dt = (1-α)·v·cos(θ)</text>
    <text x="80" y="220" font-family="'Courier New', monospace" font-size="11" fill="#e5e7eb">dy/dt = (1-α)·v·sin(θ)</text>
    <text x="80" y="238" font-family="'Courier New', monospace" font-size="11" fill="#e5e7eb">dθ/dt = (1-αω)·ω + b_gyro</text>

    <text x="70" y="270" font-family="'Segoe UI', sans-serif" font-size="11" fill="#d1d5db">
      • Longitudinal slip factor α_v
    </text>
    <text x="70" y="288" font-family="'Segoe UI', sans-serif" font-size="11" fill="#d1d5db">
      • Ornstein-Uhlenbeck gyro bias drift
    </text>
    <text x="70" y="306" font-family="'Segoe UI', sans-serif" font-size="11" fill="#d1d5db">
      • Antenna lever-arm offset geometry
    </text>
  </g>

  <!-- Stage 2: Error Dynamics & Observability -->
  <g filter="url(#cardShadow)">
    <rect x="360" y="110" width="280" height="210" rx="10" fill="#1f2937" stroke="#374151" stroke-width="1.5" />
    <rect x="360" y="110" width="6" height="210" fill="#818cf8" rx="3" />
    <text x="380" y="140" font-family="'Segoe UI', Inter, sans-serif" font-size="14" font-weight="bold" fill="#818cf8">
      2. ERROR PROPAGATION
    </text>
    <text x="380" y="165" font-family="'Segoe UI', sans-serif" font-size="11" fill="#9ca3af">
      Linearized Dynamics &amp; Gramian
    </text>

    <!-- Formula Box -->
    <rect x="380" y="180" width="240" height="65" rx="6" fill="#111827" stroke="#374151" />
    <text x="390" y="202" font-family="'Courier New', monospace" font-size="11" fill="#e5e7eb">δx_k = Φ_k · δx_{k-1} + w_k</text>
    <text x="390" y="222" font-family="'Courier New', monospace" font-size="11" fill="#e5e7eb">W_obs = Σ Φ^T H^T H Φ</text>
    <text x="390" y="240" font-family="'Courier New', monospace" font-size="11" fill="#e5e7eb">cond(W) &lt; 10^6 Stability</text>

    <text x="380" y="270" font-family="'Segoe UI', sans-serif" font-size="11" fill="#d1d5db">
      • Matrix exponential Taylor expansion
    </text>
    <text x="380" y="288" font-family="'Segoe UI', sans-serif" font-size="11" fill="#d1d5db">
      • Whitened singular value bounds
    </text>
    <text x="380" y="306" font-family="'Segoe UI', sans-serif" font-size="11" fill="#d1d5db">
      • Unobservable subspace isolation
    </text>
  </g>

  <!-- Stage 3: Absorbing PDE -->
  <g filter="url(#cardShadow)">
    <rect x="670" y="110" width="280" height="210" rx="10" fill="#1f2937" stroke="#374151" stroke-width="1.5" />
    <rect x="670" y="110" width="6" height="210" fill="#f43f5e" rx="3" />
    <text x="690" y="140" font-family="'Segoe UI', Inter, sans-serif" font-size="14" font-weight="bold" fill="#f43f5e">
      3. ABSORBING BOUNDARY PDE
    </text>
    <text x="690" y="165" font-family="'Segoe UI', sans-serif" font-size="11" fill="#9ca3af">
      First-Exit Risk (HMI Probability)
    </text>

    <!-- Formula Box -->
    <rect x="690" y="180" width="240" height="65" rx="6" fill="#111827" stroke="#374151" />
    <text x="700" y="202" font-family="'Courier New', monospace" font-size="11" fill="#e5e7eb">∂u/∂t = μ·∂u/∂x + ½σ²·∂²u/∂x²</text>
    <text x="700" y="222" font-family="'Courier New', monospace" font-size="11" fill="#e5e7eb">u(±L, t) = 1  (Absorbing)</text>
    <text x="700" y="240" font-family="'Courier New', monospace" font-size="11" fill="#e5e7eb">u(x, 0) = 0   (Safe Origin)</text>

    <text x="690" y="270" font-family="'Segoe UI', sans-serif" font-size="11" fill="#d1d5db">
      • Analytical spectral series solution
    </text>
    <text x="690" y="288" font-family="'Segoe UI', sans-serif" font-size="11" fill="#d1d5db">
      • 2D Bessel radial exit probability
    </text>
    <text x="690" y="306" font-family="'Segoe UI', sans-serif" font-size="11" fill="#d1d5db">
      • Validated vs 20k Monte Carlo paths
    </text>
  </g>

  <!-- Lower Section: Filters & Stanford Evaluation -->
  <g filter="url(#cardShadow)">
    <!-- Estimator Bank -->
    <rect x="50" y="350" width="430" height="210" rx="10" fill="#1f2937" stroke="#374151" stroke-width="1.5" />
    <rect x="50" y="350" width="6" height="210" fill="#10b981" rx="3" />
    <text x="70" y="380" font-family="'Segoe UI', Inter, sans-serif" font-size="14" font-weight="bold" fill="#10b981">
      4. ESTIMATION &amp; COLORED NOISE ADAPTATION
    </text>

    <rect x="70" y="400" width="185" height="34" rx="6" fill="#111827" stroke="#374151" />
    <text x="162" y="422" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#f9fafb" text-anchor="middle">Fixed White EKF (B0)</text>

    <rect x="270" y="400" width="190" height="34" rx="6" fill="#111827" stroke="#374151" />
    <text x="365" y="422" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#38bdf8" text-anchor="middle">Adaptive EKF (B3)</text>

    <rect x="70" y="445" width="185" height="34" rx="6" fill="#111827" stroke="#374151" />
    <text x="162" y="467" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#818cf8" text-anchor="middle">Colored OU State EKF</text>

    <rect x="270" y="445" width="190" height="34" rx="6" fill="#111827" stroke="#374151" />
    <text x="365" y="467" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#f59e0b" text-anchor="middle">Multiple-Model Bank (V2)</text>

    <text x="70" y="505" font-family="'Segoe UI', sans-serif" font-size="11" fill="#9ca3af">
      • State augmentation [x, y, θ, n_x, n_y] eliminates correlated HMI
    </text>
    <text x="70" y="525" font-family="'Segoe UI', sans-serif" font-size="11" fill="#9ca3af">
      • Innovation covariance matching with freeze mechanisms
    </text>
  </g>

  <!-- Stanford Diagram & Integrity Metrics -->
  <g filter="url(#cardShadow)">
    <rect x="510" y="350" width="440" height="210" rx="10" fill="#1f2937" stroke="#374151" stroke-width="1.5" />
    <rect x="510" y="350" width="6" height="210" fill="#f59e0b" rx="3" />
    <text x="530" y="380" font-family="'Segoe UI', Inter, sans-serif" font-size="14" font-weight="bold" fill="#f59e0b">
      5. INTEGRITY METRICS &amp; STANFORD DIAGRAM
    </text>

    <!-- 4 Quadrants -->
    <rect x="530" y="400" width="190" height="34" rx="6" fill="#111827" stroke="#10b981" />
    <text x="625" y="422" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#34d399" text-anchor="middle">Normal Operation (Safe)</text>

    <rect x="735" y="400" width="195" height="34" rx="6" fill="#111827" stroke="#38bdf8" />
    <text x="832" y="422" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#38bdf8" text-anchor="middle">Safe Alert (PL &gt; AL)</text>

    <rect x="530" y="445" width="190" height="34" rx="6" fill="#111827" stroke="#f59e0b" />
    <text x="625" y="467" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#fbbf24" text-anchor="middle">System Outage (Degraded)</text>

    <rect x="735" y="445" width="195" height="34" rx="6" fill="#111827" stroke="#ef4444" />
    <text x="832" y="467" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#f87171" text-anchor="middle">HMI: PE &gt; AL &amp; PL ≤ AL</text>

    <text x="530" y="505" font-family="'Segoe UI', sans-serif" font-size="11" fill="#9ca3af">
      • 144 Evaluation Conditions (8 Seeds × 2 Paths × 3 Noise × 3 Models)
    </text>
    <text x="530" y="525" font-family="'Segoe UI', sans-serif" font-size="11" fill="#9ca3af">
      • Rigorous paired statistical tests (Wilcoxon Signed-Rank, p &lt; 0.05)
    </text>
  </g>
</svg>
